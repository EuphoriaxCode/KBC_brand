<!doctype html><meta charset="utf-8">
<style>@font-face{font-family:"Nunito Sans";src:url(n700.ttf);font-weight:700}
html,body{margin:0;background:transparent;width:1920px;height:1080px;overflow:hidden}
.pop{position:absolute;bottom:96px;display:flex;align-items:center;height:112px;padding:0 64px;background:#fff;border-radius:8px;
 box-shadow:0 4px 16px rgba(0,54,101,.16);font-family:"Nunito Sans",sans-serif;color:#0D2A50;
 animation:card 5s cubic-bezier(.65,0,.35,1) both}
.name{font-weight:700;font-size:48px;line-height:56px;white-space:nowrap;letter-spacing:-.2px;animation:name 5s cubic-bezier(.65,0,.35,1) both}
.bar{position:absolute;left:0;bottom:0;height:5px;width:100%;background:#0097DB;animation:bar 5s cubic-bezier(.65,0,.35,1) both}
.center{left:50%;translate:-50% 0}.center .bar{transform-origin:center}
.right{right:96px}.right .bar{transform-origin:right}
@keyframes card{0%,3%{clip-path:var(--from)}13%,88%{clip-path:inset(-40px)}98%,100%{clip-path:var(--from)}}
@keyframes bar{0%{transform:scaleX(0)}10%,90%{transform:scaleX(1)}100%{transform:scaleX(0)}}
@keyframes name{0%,8%{opacity:0;transform:translateY(10px)}16%,86%{opacity:1;transform:none}92%,100%{opacity:0;transform:translateY(-6px)}}
.center{--from:inset(-40px 50% -40px 50%)}.right{--from:inset(-40px -40px -40px 100%)}
body.still *{animation:none!important}
</style>
<div class="pop" id="p"><div class="name" id="n"></div><div class="bar"></div></div>
<script>const q=new URLSearchParams(location.search);document.getElementById('n').textContent=q.get('n');document.getElementById('p').classList.add(q.get('pos'));if(q.get('still'))document.body.className='still'</script>
